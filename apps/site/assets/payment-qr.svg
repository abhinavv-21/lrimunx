<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER — this is NOT a working QR code.

  It is deliberately drawn as an obvious stand-in (dashed frame, three finder
  squares, the word PLACEHOLDER across the middle) so that nobody can mistake it
  for something scannable during review.

  TO REPLACE: overwrite THIS FILE — assets/payment-qr.svg — with the real code.
  If the real code is a PNG or JPEG rather than an SVG, drop it in as
  assets/payment-qr.png and change the one `src` in register.html marked
  "PLACEHOLDER QR". Nothing else needs to change: the plate around it is a
  fixed square and the image is object-fit: contain.

  Hex values are hardcoded here because an <img> cannot read CSS custom
  properties. They are the tokens: ink #2B0A21, magenta #B41884, paper #FAF7F3.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 320"
  width="320"
  height="320"
  role="img"
  aria-label="Placeholder QR code — the real payment QR code has not been added yet"
>
  <rect width="320" height="320" fill="#FAF7F3" />
  <rect
    x="10.5"
    y="10.5"
    width="299"
    height="299"
    fill="none"
    stroke="#B41884"
    stroke-width="1"
    stroke-dasharray="6 6"
  />

  <!-- Three finder patterns, so the shape reads as "a QR goes here". -->
  <g fill="none" stroke="#2B0A21" stroke-width="8">
    <rect x="40" y="40" width="56" height="56" />
    <rect x="224" y="40" width="56" height="56" />
    <rect x="40" y="224" width="56" height="56" />
  </g>
  <g fill="#2B0A21">
    <rect x="58" y="58" width="20" height="20" />
    <rect x="242" y="58" width="20" height="20" />
    <rect x="58" y="242" width="20" height="20" />
  </g>

  <!-- A sparse scatter, kept well clear of the label. -->
  <g fill="#2B0A21" opacity="0.22">
    <rect x="120" y="40" width="12" height="12" />
    <rect x="148" y="52" width="12" height="12" />
    <rect x="176" y="40" width="12" height="12" />
    <rect x="196" y="64" width="12" height="12" />
    <rect x="40" y="120" width="12" height="12" />
    <rect x="64" y="148" width="12" height="12" />
    <rect x="40" y="176" width="12" height="12" />
    <rect x="120" y="268" width="12" height="12" />
    <rect x="152" y="248" width="12" height="12" />
    <rect x="184" y="268" width="12" height="12" />
    <rect x="244" y="140" width="12" height="12" />
    <rect x="268" y="172" width="12" height="12" />
    <rect x="240" y="204" width="12" height="12" />
    <rect x="268" y="236" width="12" height="12" />
    <rect x="232" y="264" width="12" height="12" />
  </g>

  <rect x="40" y="140" width="240" height="52" fill="#FAF7F3" />
  <text
    x="160"
    y="164"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="600"
    letter-spacing="4"
    fill="#B41884"
  >PLACEHOLDER</text>
  <text
    x="160"
    y="184"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="11"
    letter-spacing="1"
    fill="#2B0A21"
  >replace assets/payment-qr.svg</text>
</svg>
