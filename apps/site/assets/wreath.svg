<!--
  LRI MUN laurel wreath, extracted as line art for use at display size.

  Branches and ribbon only: the shield, endless knot, hands and lotus of the
  full mark are illegible above ~60px and turn to mud when scaled up, so the
  full-colour PNG is used at small sizes (nav, footer, preloader, favicon) and
  this device is used large. Open at the crown on purpose — that gap is what
  makes it read as a laurel rather than a ring.

  Uses currentColor so the palette drives it. Generated, not hand-drawn.
-->
